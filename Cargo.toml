[package]
name = "omataskbar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Omarchy-styled live stats for the Apple Silicon Touch Bar"

[dependencies]
anyhow = "1"
cairo-rs = { version = "0.20", default-features = false, features = ["freetype", "png"] }
drm = "0.14"
freetype-rs = "0.37"
input = "0.8"
input-linux = { version = "0.7", features = ["serde"] }
input-linux-sys = "0.9"
libc = "0.2"
nix = { version = "0.29", features = ["event", "signal", "inotify"] }
privdrop = "0.5.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = true
